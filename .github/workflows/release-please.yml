name: Release Please

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN-triggered events do not start new workflow runs, so the
          # Release PR opened with the default token would never get CodeQL/gitleaks
          # runs — and the master ruleset requires code scanning results, making
          # the PR unmergeable. A PAT avoids that trigger suppression.
          token: ${{ secrets.MULTILINT_ACTIONS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Queue the release PR for merge once the master ruleset's required checks
      # pass (needs "Allow auto-merge" in the repository settings). The merge is
      # made with the PAT, so its push to master runs this workflow again, which
      # tags the release and starts docker-publish and npm-publish.
      #
      # The PR number is parsed in the shell: step env is evaluated even when
      # `if` skips the step, and fromJSON() fails on the empty `pr` output of a
      # run that touched no release PR.
      - name: Auto-merge the release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.MULTILINT_ACTIONS_TOKEN }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: gh pr merge "$(jq -r '.number' <<<"$PR_JSON")" --auto --rebase --repo "$GITHUB_REPOSITORY"
