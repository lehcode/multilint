name: Release Please

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN-triggered events do not start new workflow runs, so the
          # Release PR opened with the default token would never get CodeQL/gitleaks
          # runs — and the master ruleset requires code scanning results, making
          # the PR unmergeable. A PAT avoids that trigger suppression.
          token: ${{ secrets.MULTILINT_ACTIONS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
