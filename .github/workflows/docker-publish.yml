name: Publish Docker Image to Docker Hub and ghcr.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOCKER_HUB_REGISTRY: docker.io
  DOCKER_HUB_IMAGE: lehcode/multilint
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug Docker Hub token
        run: |
          TOKEN="${{ secrets.DOCKER_HUB_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "ERROR: DOCKER_HUB_TOKEN is empty!"
            exit 1
          else
            TOKEN_LEN=${#TOKEN}
            echo "DOCKER_HUB_TOKEN is set (length: $TOKEN_LEN)"
            echo "First 8 chars: ${TOKEN:0:8}..."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: lehcode
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            docker.io/lehcode/multilint:${GITHUB_REF_NAME}
            docker.io/lehcode/multilint:latest
            ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            io.modelcontextprotocol.server.name=com.lehcode/multilint
            io.modelcontextprotocol.server.version=0.1.0
            org.opencontainers.image.description=Code quality delegation for AI agents - shellcheck, pylint, black, gitleaks via one MCP tool
