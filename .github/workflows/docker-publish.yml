name: Publish Docker Image to ghcr.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            io.modelcontextprotocol.server.name=com.lehcode/multilint
            io.modelcontextprotocol.server.version=0.1.0
            org.opencontainers.image.description=Code quality delegation for AI agents - shellcheck, pylint, black, gitleaks via one MCP tool
