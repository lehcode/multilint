name: Publish to npm

on:
  release:
    types: ['published']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: npm exchanges this OIDC token for an
  # attestation linking the published tarball to this commit and workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url is what makes setup-node write the .npmrc that
          # NODE_AUTH_TOKEN is read from; without it the publish is anonymous.
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # The npm bundled with Node 22 predates `npm stage`, so the staging step
      # fails with `Unknown command: "stage"`. Upgrade before using it; it also
      # brings trusted publishing (OIDC), which needs npm >= 11.5.1.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm -v

      # Lockfile-exact install without dependency lifecycle scripts: this job
      # holds publish rights (id-token).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify package version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag is $tag but package.json says $pkg"
            exit 1
          fi
          echo "version $pkg matches tag"

      # Stages the version rather than publishing it. Authentication is npm
      # trusted publishing (trusted publisher: repo lehcode/multilint, workflow
      # npm-publish.yml); no npm token is stored in CI. A maintainer promotes
      # the staged version with `npm stage approve <stage-id>`, supplying 2FA.
      #
      # prepublishOnly runs here and rebuilds dist/ from src/, so the tarball
      # never ships a stale committed bundle.
      - name: Stage release
        run: npm stage publish --provenance --access public

      - name: Report staged version
        run: |
          echo "Staged $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")."
          echo "Promote it with: npm stage list && npm stage approve <stage-id>"
