name: Publish to npm

on:
  release:
    types: ['published']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: npm exchanges this OIDC token for an
  # attestation linking the published tarball to this commit and workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url is what makes setup-node write the .npmrc that
          # NODE_AUTH_TOKEN is read from; without it the publish is anonymous.
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag is $tag but package.json says $pkg"
            exit 1
          fi
          echo "version $pkg matches tag"

      # prepublishOnly builds dist/, which is gitignored and so absent from a
      # clean checkout. Without the build the tarball would ship empty.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
