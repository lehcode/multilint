services:
  multilint:
    container_name: multilint
    build:
      context: .
    environment:
      - CONTINUOUS_LINT=1
      - LINT_SERVER_PORT=8591
      - LINT_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8592
    ports:
      - "8591:8591"
      - "8592:8592"
    volumes:
      - ~/lan-hosts:/workspace:ro
      - ~/docker-compose.d/multilint:/multilint:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: curl -f http://localhost:8591/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
